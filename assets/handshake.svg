<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="300" height="150" role="img" aria-label="Animation of the TCP three-way handshake: SYN, SYN-ACK, ACK" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>tcp three-way handshake</title>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7B2FF7"/><stop offset="0.5" stop-color="#00D4FF"/><stop offset="1" stop-color="#7B2FF7"/></linearGradient>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7B2FF7"/></marker>
    <filter id="glow" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="298" height="148" rx="10" fill="#070A1C"/>
  <rect x="1.5" y="1.5" width="297" height="147" rx="10" fill="none" stroke="url(#edge)" stroke-width="1.1" filter="url(#glow)"/>

  <!-- hosts -->
  <g font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="8.5" letter-spacing="1.6" text-anchor="middle">
    <rect x="12" y="12" width="52" height="18" rx="4" fill="none" stroke="#00D4FF" stroke-opacity="0.8"/><text x="38" y="24" fill="#00D4FF">CLIENT</text>
    <rect x="236" y="12" width="52" height="18" rx="4" fill="none" stroke="#C77DFF" stroke-opacity="0.8"/><text x="262" y="24" fill="#C77DFF">SERVER</text>
  </g>
  <line x1="38" y1="32" x2="38" y2="132" stroke="#7B2FF7" stroke-opacity="0.6" stroke-dasharray="3 3"/>
  <line x1="262" y1="32" x2="262" y2="132" stroke="#7B2FF7" stroke-opacity="0.6" stroke-dasharray="3 3"/>

  <!-- guide arrows -->
  <line x1="40" y1="50" x2="258" y2="64" stroke="#7B2FF7" stroke-opacity="0.45" marker-end="url(#ar)"/>
  <line x1="260" y1="78" x2="42" y2="92" stroke="#7B2FF7" stroke-opacity="0.45" marker-end="url(#ar)"/>
  <line x1="40" y1="106" x2="258" y2="120" stroke="#7B2FF7" stroke-opacity="0.45" marker-end="url(#ar)"/>

  <!-- packets (SYN -> SYN-ACK -> ACK) -->
  <g opacity="0">
    <animateMotion path="M40,50 L260,64" dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.04;0.22;1"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.060;0.22;0.240;1" dur="7s" repeatCount="indefinite"/>
    <rect x="-24" y="-8" width="48" height="16" rx="4" fill="#070A1C" stroke="#00D4FF" stroke-width="1" filter="url(#glow)"/>
    <text y="3" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="8.5" font-weight="700" fill="#00D4FF">SYN</text>
  </g>
  <g opacity="0">
    <animateMotion path="M260,78 L40,92" dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.27;0.45;1"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.27;0.290;0.45;0.470;1" dur="7s" repeatCount="indefinite"/>
    <rect x="-24" y="-8" width="48" height="16" rx="4" fill="#070A1C" stroke="#C77DFF" stroke-width="1" filter="url(#glow)"/>
    <text y="3" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="8.5" font-weight="700" fill="#C77DFF">SYN-ACK</text>
  </g>
  <g opacity="0">
    <animateMotion path="M40,106 L260,120" dur="7s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5;0.68;1"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.520;0.68;0.700;1" dur="7s" repeatCount="indefinite"/>
    <rect x="-24" y="-8" width="48" height="16" rx="4" fill="#070A1C" stroke="#00D4FF" stroke-width="1" filter="url(#glow)"/>
    <text y="3" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="8.5" font-weight="700" fill="#00D4FF">ACK</text>
  </g>

  <!-- result -->
  <text x="150" y="144" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="8.5" letter-spacing="2.4" fill="#7DEBFF" opacity="0" filter="url(#glow)">ESTABLISHED
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.69;0.73;0.93;0.97;1" dur="7s" repeatCount="indefinite"/>
  </text>
</svg>
